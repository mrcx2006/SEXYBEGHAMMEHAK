<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mehak 💖</title>

<!-- Luxury Rounded Fonts -->
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #fde2e4, #f6c1cc);
  font-family: 'Quicksand', sans-serif;
  overflow: hidden;
}

/* Floating hearts */
.heart {
  position: absolute;
  bottom: -50px;
  font-size: 18px;
  animation: float 10s linear infinite;
  opacity: 0.6;
}

@keyframes float {
  0% { transform: translateY(0) scale(0.8); }
  100% { transform: translateY(-110vh) scale(1.3); }
}

/* Center card */
.container {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 35px 28px;
  border-radius: 28px;
  text-align: center;
  box-shadow: 0 30px 70px rgba(0,0,0,0.18);
  max-width: 390px;
  width: 90%;
  animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  font-family: 'DM Serif Display', serif;
  color: #c9184a;
  margin-bottom: 6px;
}

.subtitle {
  font-size: 14px;
  color: #888;
  margin-bottom: 20px;
}

p {
  font-size: 17px;
  line-height: 1.6;
  color: #333;
}

button {
  margin-top: 25px;
  padding: 12px 30px;
  border-radius: 30px;
  border: none;
  background: #c9184a;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.buttons {
  margin-top: 30px;
  position: relative;
  height: 120px;
}

#no {
  background: #eee;
  color: #333;
  position: absolute;
}

/* Cute monster */
.monster {
  font-size: 60px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<!-- Music -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2023/03/30/audio_38e8cfa4e5.mp3" type="audio/mpeg">
</audio>

<!-- Floating hearts -->
<script>
for(let i=0;i<25;i++){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(6+Math.random()*6)+"s";
  document.body.appendChild(h);
}
</script>

<div class="container">
  <div class="card" id="page">

    <!-- PAGE 1 -->
    <div id="p1">
      <div class="monster">👾💕</div>
      <h1>Mehak</h1>
      <div class="subtitle">
        (My Begham Sahiba, Baby gurl, My teddy bear & Sexy 😌)
      </div>
      <p>
        Before we begin…  
        tap once and let the moment feel right 💕
      </p>
      <button onclick="start()">Enter 💖</button>
    </div>

  </div>
</div>

<script>
function start(){
  document.getElementById("music").play();
  document.getElementById("page").innerHTML = `
    <h1>My Love 💋</h1>
    <p>
      Loving you has been my favorite addiction.  
      Soft days, wild nights — all of it with you.
      <br><br>
      Lets turn white walls Gary 😏  
      I love lotus 🌸
    </p>
    <button onclick="question()">Continue →</button>
  `;
}

function question(){
  document.getElementById("page").innerHTML = `
    <h1>So tell me…</h1>
    <p>
      Will you be my Valentine?  
      Not just today… but always 💖
    </p>
    <div class="buttons">
      <button onclick="yes()">YES 💖</button>
      <button id="no" onmouseover="moveNo()">NO 🙃</button>
    </div>
  `;
}

function moveNo(){
  const no=document.getElementById("no");
  no.style.left=Math.random()*240+"px";
  no.style.top=Math.random()*80+"px";
}

function yes(){
  document.body.innerHTML=`
    <div class="container">
      <div class="card">
        <h1>I knew it 😍</h1>
        <p>
          My Mehak…  
          you’ve always owned my heart ❤️
        </p>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
